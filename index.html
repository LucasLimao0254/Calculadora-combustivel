<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" data-own>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-own>
<meta name="theme-color" content="#161826" data-own>
<meta name="color-scheme" content="dark" data-own>
<title data-own>Calculadora de Reajuste</title>
<link rel="manifest" href="manifest.webmanifest" data-own>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" data-own>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" data-own>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" data-own>
<meta name="mobile-web-app-capable" content="yes" data-own>
<meta name="apple-mobile-web-app-capable" content="yes" data-own>
<meta name="apple-mobile-web-app-title" content="Reajuste" data-own>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" data-own>
<link rel="preconnect" href="https://fonts.googleapis.com" data-own>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin data-own>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" data-own>
<link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" rel="stylesheet" data-own>
<link href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css" rel="stylesheet" data-own>
<style data-own>
/* ---------- Tokens (tema Nocturne) ---------- */
:root{
  color-scheme:dark;
  --color-bg:#161826;--color-surface:#232532;--color-text:#e9e9ed;--color-accent:#9184d9;
  --color-divider:color-mix(in srgb,#e9e9ed 16%,transparent);
  --color-neutral-700:#595d6c;--color-neutral-800:#3f424d;--color-neutral-900:#292b31;
  --color-accent-300:#d2cefd;--color-accent-400:#b5abfc;--color-accent-800:#423a6a;--color-accent-900:#2b2741;
  --radius-sm:4px;--radius-md:8px;--radius-lg:14px;
  --shadow-sm:0 0 0 1px #3f424d;--shadow-md:0 0 0 1px #595d6c,0 6px 18px rgba(0,0,0,.55);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* Combustíveis e variação */
  --f-gas:oklch(0.74 0.12 50);--f-adt:oklch(0.74 0.10 245);--f-s10:oklch(0.77 0.10 170);--f-s500:oklch(0.83 0.11 88);
  --good:oklch(0.80 0.12 155);--bad:oklch(0.74 0.14 25);
  --t50:color-mix(in srgb,var(--color-text) 50%,transparent);
  --t55:color-mix(in srgb,var(--color-text) 55%,transparent);
  --t60:color-mix(in srgb,var(--color-text) 60%,transparent);
  --t65:color-mix(in srgb,var(--color-text) 65%,transparent);
  --t70:color-mix(in srgb,var(--color-text) 70%,transparent);
  --t75:color-mix(in srgb,var(--color-text) 75%,transparent);
  --rule:linear-gradient(to right,transparent,var(--color-divider) 48px,var(--color-divider) calc(100% - 48px),transparent);
  --rule-soft:linear-gradient(to right,transparent,color-mix(in srgb,var(--color-text) 8%,transparent) 48px,color-mix(in srgb,var(--color-text) 8%,transparent) calc(100% - 48px),transparent);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:15px;line-height:1.55;color:var(--color-text);
  background:radial-gradient(120% 50% at 0% 0%,var(--color-accent-900),var(--color-bg) 70%) fixed,var(--color-bg);
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
h3,h5,h6{font-weight:500;line-height:1.12;letter-spacing:-0.015em;margin:0}
h3{font-size:25px}h5{font-size:16px}
h6{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--t55);margin:6px 4px 0}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}
*{scrollbar-width:none}*::-webkit-scrollbar{display:none}
input[type=date]{color-scheme:dark}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}.eq{color:var(--t60)}
.muted{color:var(--t55)}

/* ---------- Componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2;
  color:var(--color-text);background:transparent;border:1px solid transparent;padding:0 14px;min-height:44px;border-radius:var(--radius-md);white-space:nowrap}
.btn i{font-size:17px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{color:var(--color-accent);border-color:var(--color-accent)}
.btn-primary:hover{background:color-mix(in srgb,var(--color-accent) 12%,transparent)}
.btn-primary:active{background:color-mix(in srgb,var(--color-accent) 22%,transparent)}
.btn-secondary{border-color:var(--color-divider)}
.btn-secondary:hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.btn-secondary:active{background:color-mix(in srgb,var(--color-text) 14%,transparent)}
.btn-icon{width:44px;height:44px;padding:0;flex:none}
.btn-block{width:100%}
.btn.danger{color:var(--bad)}
.btn.armed{color:var(--bad);border-color:var(--bad)}
.seg{display:inline-flex;overflow:hidden;border:1px solid var(--color-divider);border-radius:var(--radius-md)}
.seg-opt{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 14px;font-size:13px;cursor:pointer;background:transparent;border:0;color:var(--color-text)}
.seg-opt+.seg-opt{border-left:1px solid var(--color-divider)}
.seg-opt[aria-pressed="true"]{color:var(--color-accent);box-shadow:inset 0 0 0 1px var(--color-accent)}
.seg-opt:not([aria-pressed="true"]):hover{background:color-mix(in srgb,var(--color-text) 7%,transparent)}
.seg-opt:focus-visible{outline-offset:-2px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;letter-spacing:.02em;padding:3px 10px;border-radius:6px;font-variant-numeric:tabular-nums;
  background:color-mix(in srgb,currentColor 16%,transparent)}
.hr{height:1px;border:0;margin:0;background:var(--rule)}
.card{background:var(--color-surface);border-radius:var(--radius-lg);padding:16px;display:flex;flex-direction:column;gap:12px}
.mk{display:inline-block;flex:none;width:9px;height:9px;background:var(--c)}
.mk.sm{width:8px;height:8px}.mk.xs{width:7px;height:7px}
.mk-c{border-radius:50%}.mk-s{border-radius:1px}
.mk-t{clip-path:polygon(50% 0,100% 100%,0 100%)}
.mk-d{transform:rotate(45deg) scale(.82)}
.mk-avg{width:14px;height:2px;border-radius:1px}
/* Campo com prefixo e sufixo */
.fld{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;background:var(--color-bg);border:1px solid var(--color-divider);border-radius:var(--radius-md)}
.fld:focus-within{border-color:var(--color-accent)}
.fld>span{font-size:12px;color:var(--t50)}
.fld input{flex:1;min-width:0;width:100%;background:transparent;border:0;font-size:17px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums;caret-color:var(--color-accent)}
.fld input:focus-visible{outline:none}
.inp{min-width:0;height:44px;padding:0 10px;background:var(--color-bg);border:1px solid var(--color-divider);border-radius:var(--radius-md);
  font-size:15px;text-align:right;font-variant-numeric:tabular-nums;caret-color:var(--color-accent)}
.inp:focus-visible{border-color:var(--color-accent);outline:none}
.inp[type=date]{text-align:left;font-size:14px}

/* ---------- Estrutura ---------- */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:calc(6px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 20px max(16px,env(safe-area-inset-left))}
.screen{display:flex;flex-direction:column;gap:12px;animation:scrIn 220ms ease-out}
@keyframes scrIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:4px 4px 2px}
.sh .aux{font-size:12px;color:var(--t55);font-variant-numeric:tabular-nums;text-align:right}
.tabbar{flex:none;position:relative;display:grid;grid-template-columns:repeat(4,1fr);
  padding:0 max(8px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  background:color-mix(in srgb,var(--color-surface) 60%,var(--color-bg))}
.tabbar::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:var(--rule)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;
  background:transparent;border:0;cursor:pointer;color:var(--t55)}
.tab i{font-size:24px}
.tab span{font-size:11px;letter-spacing:.01em}
.tab .mark{position:absolute;top:0;width:22px;height:2px;border-radius:2px;background:transparent}
.tab[aria-current="page"]{color:var(--color-accent)}
.tab[aria-current="page"] .mark{background:var(--color-accent);box-shadow:0 0 10px var(--color-accent)}
.tab:active{opacity:.7}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;max-width:calc(100vw - 32px);
  background:var(--color-surface);box-shadow:var(--shadow-md);padding:9px 16px;border-radius:var(--radius-md);font-size:14px;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* ---------- Início ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:7px;min-height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--color-divider);
  background:transparent;font-size:13px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="false"]{opacity:.45}
.chart{margin:0 -6px;min-height:200px}
.chart svg{display:block;width:100%;height:200px;font-variant-numeric:tabular-nums}
.chart .empty{height:200px;display:grid;place-items:center;font-size:13px;color:var(--t55);text-align:center;padding:0 16px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .lbl{font-size:12px;color:var(--t60)}
.kpi .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kpi .big .v{font-size:38px;font-weight:500;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .big .m{font-size:17px;color:var(--t60);font-variant-numeric:tabular-nums}
.kpi .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t60)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fb{background:var(--color-bg);border-radius:var(--radius-md);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fb .fn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t65)}
.fb .fv{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.fb .fm{font-size:12px;color:var(--t55);font-variant-numeric:tabular-nums}

/* ---------- Simular ---------- */
.cmp{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:8px;padding:14px 16px;font-size:13px;font-variant-numeric:tabular-nums;align-items:baseline}
.cmp .hd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:right;color:var(--t55)}
.cmp .hd.sc{color:var(--color-accent-300)}
.cmp .rl{color:var(--t65)}
.cmp .a{text-align:right;color:var(--t70)}
.cmp .s{text-align:right;font-weight:500}
.cmp .s.lg{font-size:15px}
.cmp .tag{justify-self:end}
.slist{padding:4px 16px;gap:0}
.srow{display:flex;flex-direction:column;gap:8px;padding:14px 0;background:var(--rule-soft) no-repeat bottom/100% 1px}
.srow:last-child{background:none}
.srow-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sn{display:flex;flex-direction:column;gap:2px;min-width:0}
.sn .fname{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:500}
.sn .sub{font-size:11px;color:var(--t55);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:4px}
.stepper i{font-size:16px}
.stepper input{width:70px;height:44px;background:var(--color-bg);border:1px solid var(--color-divider);border-radius:var(--radius-md);
  font-size:17px;font-weight:500;text-align:center;font-variant-numeric:tabular-nums;caret-color:var(--color-accent)}
.stepper input:focus-visible{border-color:var(--color-accent);outline:none}
.srow-f{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.srow-f .lu{color:var(--t60)}
.srow-f .lu i{font-size:11px}
.srow-f .lu b{font-weight:500}
.srow-f .dc{display:flex;align-items:center;gap:3px;white-space:nowrap}
.collapse{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:48px;padding:6px 16px;background:var(--color-surface);
  border:0;border-radius:var(--radius-lg);font-size:14px;cursor:pointer;text-align:left}
.collapse .t{display:flex;flex-direction:column}
.collapse .t small{font-size:11px;color:var(--t55)}
.collapse i{font-size:16px}
.custos{display:grid;grid-template-columns:72px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:12px 16px}
.custos .hd{font-size:11px;color:var(--t60)}
.custos .fn{display:flex;align-items:center;gap:6px;font-size:13px}
.extra{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px}
.extra label{font-size:12px;color:var(--t60)}
.extra .inp[type=date]{width:160px;height:44px}
.extra .acts{display:flex;gap:8px;margin-left:auto}
.save{min-height:48px;font-size:15px}

/* ---------- Histórico ---------- */
.hlist{display:flex;flex-direction:column;gap:8px}
.hcard{background:var(--color-surface);border-radius:var(--radius-lg)}
.hcard.open{box-shadow:var(--shadow-sm)}
.hrow{width:100%;display:grid;grid-template-columns:1fr auto 20px;align-items:center;gap:10px;padding:12px 14px 12px 16px;min-height:64px;
  background:transparent;border:0;text-align:left;cursor:pointer}
.hrow .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.hrow .l b{font-size:15px;font-weight:500}
.hrow .l small{font-size:12px;color:var(--t55);font-variant-numeric:tabular-nums}
.hrow .r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-variant-numeric:tabular-nums}
.hrow .r b{font-size:15px;font-weight:400}
.hrow .r small{display:flex;align-items:center;gap:3px;font-size:12px}
.hrow>i{font-size:14px;color:var(--t55)}
.hdet{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
.htab{display:grid;grid-template-columns:74px 1fr 1fr .8fr 1fr;gap:6px 4px;font-size:12px;font-variant-numeric:tabular-nums;align-items:center}
.htab .th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--t50);text-align:right}
.htab .r{text-align:right}
.htab .fn{display:flex;align-items:center;gap:5px}
.hdate{display:flex;align-items:center;gap:8px}
.hdate label{font-size:12px;color:var(--t60)}
.hdate .inp{height:40px;width:170px}
.hbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty-card{font-size:14px;color:var(--t70);text-align:center;padding:28px 16px}

/* ---------- Ajustes ---------- */
.blk{display:flex;flex-direction:column;gap:5px}
.blk>.t{font-size:13px}
.blk>small{font-size:12px;color:var(--t55)}
.seg.wide{display:grid;grid-template-columns:1fr 1fr}
.seg.wide .seg-opt{min-height:44px;padding:0 8px}
.fixgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fixgrid .fn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t65)}
.fixgrid .fld{padding:0 10px}
.fixgrid .fld>span{font-size:11px}
.fixgrid .fld input{font-size:16px;font-weight:400}
.note{display:flex;gap:10px;align-items:flex-start}
.note i{font-size:20px;color:var(--color-accent-300);margin-top:1px}
.note p{font-size:13px;color:var(--t75)}
.btn.start{justify-content:flex-start;min-height:46px;padding:0 14px}
.confirm{border:1px solid var(--color-accent);border-radius:var(--radius-md);padding:12px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 0 18px color-mix(in srgb,var(--color-accent) 25%,transparent)}
.confirm .fname{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;word-break:break-all}
.confirm p{font-size:13px;color:var(--t75)}
.ok{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--color-accent-300)}
.err{font-size:13px;color:var(--bad)}
</style>
</head>
<body>
<div id="app" data-own>
  <div class="scroll" id="scroll">
    <section class="screen" id="s-inicio" hidden></section>
    <section class="screen" id="s-simular" hidden></section>
    <section class="screen" id="s-historico" hidden></section>
    <section class="screen" id="s-ajustes" hidden></section>
  </div>
  <nav class="tabbar" aria-label="Telas">
    <button type="button" class="tab" data-go="inicio"><span class="mark"></span><i class="ph ph-chart-line" data-ic="chart-line" aria-hidden="true"></i><span>Início</span></button>
    <button type="button" class="tab" data-go="simular"><span class="mark"></span><i class="ph ph-calculator" data-ic="calculator" aria-hidden="true"></i><span>Simular</span></button>
    <button type="button" class="tab" data-go="historico"><span class="mark"></span><i class="ph ph-clock-counter-clockwise" data-ic="clock-counter-clockwise" aria-hidden="true"></i><span>Histórico</span></button>
    <button type="button" class="tab" data-go="ajustes"><span class="mark"></span><i class="ph ph-gear-six" data-ic="gear-six" aria-hidden="true"></i><span>Ajustes</span></button>
  </nav>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script type="application/json" id="state" data-own>{"rev":1,"cfg":{"frete":0,"modo":"pct","pct":0,"fixo":{"gas":0,"adt":0,"s10":0,"s500":0}},"padrao":{"frete":0,"modo":"pct","pct":0,"fixo":{"gas":0,"adt":0,"s10":0,"s500":0}},"hist":[],"seed":[]}</script>
<script id="main" data-own>
// Captura da estrutura original da página (antes de qualquer alteração), usada para salvar o histórico
const OWN=[...document.querySelectorAll("[data-own]")].map(e=>({head:e.parentNode===document.head,id:e.id,html:e.outerHTML}));

const FUELS=[
  {id:"gas",nome:"Gasolina Comum",curto:"Gasolina",cor:"var(--f-gas)",mk:"c"},
  {id:"adt",nome:"Gasolina Aditivada",curto:"Aditivada",cor:"var(--f-adt)",mk:"s"},
  {id:"s10",nome:"Diesel S10",curto:"S10",cor:"var(--f-s10)",mk:"t"},
  {id:"s500",nome:"Diesel S500",curto:"S500",cor:"var(--f-s500)",mk:"d"}
];
const LS_STATE="calc-reajuste-state", LS_DRAFT="calc-reajuste-draft", LS_UI="calc-reajuste-ui", LS_SCREEN="calc-reajuste-screen";
const ls={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};

const EMBED=JSON.parse(document.getElementById("state").textContent);
// Configuração padrão ("Restaurar padrão"): vem de data/config.json, embutida pelo build
const DEFAULT_CFG=JSON.parse(JSON.stringify(EMBED.padrao||EMBED.cfg));
let state=EMBED;
const local=ls.get(LS_STATE);
if(local&&local.hist&&local.rev>state.rev)state=local;
const ORIGINAL_HIST=JSON.parse(JSON.stringify(EMBED.seed||[]));

// Formatação pt-BR
const nf={};const fmt=(x,d)=>(nf[d]||(nf[d]=new Intl.NumberFormat("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}))).format(Number.isFinite(x)?x:0);
const brl=(x,d=2)=>"R$ "+fmt(x,d);
function parseBR(s,isQty){s=String(s).trim().replace(/[R$\s%]/g,"");if(!s)return 0;if(isQty||s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isFinite(n)?n:0;}
const fmtDate=d=>d?d.split("-").reverse().join("/"):"";
const dCurta=d=>d?d.slice(8,10)+"/"+d.slice(5,7):"";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);

// Cálculo (fórmulas da planilha): Custo = Compra + Frete + Imposto; Lucro = Venda − Custo
function calc(itens){
  const L=itens.map(it=>{
    const imp=it.tm==="p"?it.v*it.t/100:it.t;
    const custo=it.c+it.f+imp;

function drawChart(){
  const box=$("chart");if(!box)return;
  const rows=periodRows();
  if(!rows.length){box.innerHTML=`<div class="empty">Nenhum reajuste salvo ainda.</div>`;return;}
  const w=Math.max(260,Math.round(box.clientWidth||330)),h=200,P={l:38,r:12,t:10,b:22};
  const res=rows.map(x=>calc(x.itens)),vals=[];
  res.forEach(r=>{FUELS.forEach((f,i)=>{if(ui.show[f.id])vals.push(r.L[i].lucro);});if(ui.show.avg)vals.push(r.ml);});
  // Grade a cada R$ 0,50 (dobra o passo se ficar com linhas demais)
  let step=0.5,mx,mn;
  for(;;){mx=Math.ceil(Math.max(...vals)/step)*step;mn=Math.min(0,Math.floor(Math.min(...vals)/step)*step);if(mx<=mn)mx=mn+step;if((mx-mn)/step<=8)break;step*=2;}
  const X=i=>P.l+(rows.length<2?(w-P.l-P.r)/2:i*(w-P.l-P.r)/(rows.length-1));
  const Y=v=>P.t+(mx-v)/(mx-mn)*(h-P.t-P.b);
  const muted="rgba(233,233,237,.5)",k=[];
  for(let g=mn;g<=mx+1e-9;g+=step){
    k.push(`<line x1="${P.l}" x2="${w-P.r}" y1="${Y(g).toFixed(1)}" y2="${Y(g).toFixed(1)}" stroke="rgba(233,233,237,.08)"/>`);
    k.push(`<text x="${P.l-6}" y="${(Y(g)+3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="${muted}">${fmt(g,2)}</text>`);
  }
  const every=Math.max(1,Math.ceil(rows.length/5));
  const lastI=rows.length-1;
  rows.forEach((x,i)=>{if((i%every===0&&lastI-i>=every)||i===lastI)k.push(`<text x="${X(i).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="10" fill="${muted}">${esc(shortName(x))}</text>`);});
  const path=fn=>res.map((r,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(fn(r)).toFixed(1)).join("");
  const dot=fn=>rows.length===1?res.map((r,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(fn(r)).toFixed(1)}" r="3"`).join(""):"";
  FUELS.forEach((f,fi)=>{if(!ui.show[f.id])return;
    k.push(`<path d="${path(r=>r.L[fi].lucro)}" fill="none" stroke="${f.cor}" stroke-width="1.75" stroke-linejoin="round"/>`);
    if(rows.length===1)k.push(`${dot(r=>r.L[fi].lucro)} fill="${f.cor}"/>`);});
  if(ui.show.avg){
    k.push(`<path d="${path(r=>r.ml)}" fill="none" stroke="var(--color-text)" stroke-width="2.5" stroke-dasharray="5 4" stroke-linejoin="round"/>`);
    if(rows.length===1)k.push(`${dot(r=>r.ml)} fill="var(--color-text)"/>`);
  }
  const ult=res[res.length-1];
  const desc=`Gráfico do lucro bruto por litro em ${rows.length} reajuste${rows.length>1?"s":""}. Último: média ${brl(ult.ml,4)}.`;
  box.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(desc)}">${k.join("")}</svg>`;
}

  const linhas=FUELS.map((f,i)=>`${f.nome}: ${fmt(it[i].q,0)} L | compra ${brl(it[i].c,4)} | venda ${brl(it[i].v)} | custo/L ${brl(r.L[i].custo,4)} | lucro/L ${brl(r.L[i].lucro,4)}`);
  const txt=[nextName()+" · "+fmtDate(simDate()),...linhas,"",`Frete: ${brl(c.frete)}/L | Imposto: ${c.modo==="pct"?fmt(c.pct,2)+"% da venda":"valor fixo por litro"}`,
    `Volume total: ${fmt(r.vol,0)} L`,`Custo total: ${brl(r.ct)}`,`Faturamento total: ${brl(r.fat)}`,`Lucro Bruto Total: ${brl(r.lb)}`,`Média de custo: ${brl(r.mc,4)}`,`Média de lucro: ${brl(r.ml,4)}`].join("\n");
  try{await navigator.clipboard.writeText(txt);setFlash("copy","copyBtn",`<i class="ph ph-copy-simple"></i>Copiado`,`<i class="ph ph-copy-simple"></i>Copiar`);}
  catch(e){toast("Não foi possível copiar neste navegador");}
}

// ---------- Histórico ----------
let histOpen=null,delArm=null;
function renderHist(){
  const el=$("s-historico"),n=state.hist.length;
  if(histOpen===null)histOpen=new Set(n?[state.hist[n-1].id]:[]);
  const rows=state.hist.map((h,i)=>({h,i,r:calc(h.itens)}));
  el.innerHTML=`<header class="sh" style="padding-bottom:6px"><h3>Histórico</h3><span class="aux">${n} reajuste${n===1?"":"s"}</span></header>
  ${n?`<div class="hlist">${rows.slice().reverse().map(({h,i,r})=>{
    const prev=rows[i-1],open=histOpen.has(h.id),d=prev?r.ml-prev.r.ml:null,arm=delArm===h.id;
    return `<div class="hcard ${open?"open":""}">
      <button type="button" class="hrow" data-tog="${esc(h.id)}" aria-expanded="${open}">
        <span class="l"><b>${esc(h.nome)}</b><small>${h.data?fmtDate(h.data):"sem data"} · Total ${brl(r.lb)}</small></span>
        <span class="r"><b class="${r.ml<0?"neg":""}">${brl(r.ml,4)}</b>${d!==null?`<small class="${dCls(d)}">${caret(d)}${brl(Math.abs(d),4)}</small>`:""}</span>
        <i class="ph ${open?"ph-caret-up":"ph-caret-down"}" aria-hidden="true"></i>
      </button>
      ${open?`<div class="hdet">
        <div class="htab">
          <span></span><span class="th">Qtd</span><span class="th">Compra</span><span class="th">Venda</span><span class="th">Lucro</span>
          ${FUELS.map((f,k)=>{const it=h.itens[k],l=r.L[k].lucro;return `<span class="fn">${mk(f,"xs")}${f.curto}</span><span class="r">${fmt(it.q,0)}</span><span class="r">${fmt(it.c,4)}</span><span class="r">${fmt(it.v,2)}</span><span class="r ${l<0?"neg":""}">${fmt(l,4)}</span>`;}).join("")}
        </div>
        <div class="hdate"><label for="d-${esc(h.id)}">Data</label><input class="inp" type="date" id="d-${esc(h.id)}" data-date="${esc(h.id)}" value="${h.data||""}"></div>
        <div class="hbtns">
          <button type="button" class="btn btn-primary" data-base="${esc(h.id)}"><i class="ph ph-copy-simple"></i>Usar como base</button>
          <button type="button" class="btn btn-secondary danger ${arm?"armed":""}" data-del="${esc(h.id)}"><i class="ph ph-trash"></i>${arm?"Confirmar":"Excluir"}</button>
        </div>
      </div>`:""}
    </div>`;}).join("")}</div>`
  :`<div class="card empty-card">Nenhum reajuste salvo ainda.<br>Salve o primeiro em Simular ou importe um backup em Ajustes.</div>`}`;
}
{
  const el=$("s-historico");
  el.addEventListener("click",async e=>{
    const b=e.target.closest("button");if(!b)return;
    if(b.dataset.tog){const id=b.dataset.tog;if(histOpen.has(id))histOpen.delete(id);else histOpen.add(id);delArm=null;renderHist();}
    else if(b.dataset.base){
      const h=state.hist.find(x=>x.id===b.dataset.base);if(!h)return;
      draft=draftFrom(h);saveDraft();custosOpen=false;go("simular");toast("Preços de "+h.nome+" copiados para Simular");
    }
    else if(b.dataset.del){
      const id=b.dataset.del,h=state.hist.find(x=>x.id===id);if(!h)return;
      if(delArm!==id){delArm=id;renderHist();return;}
      delArm=null;histOpen.delete(id);state.hist=state.hist.filter(x=>x.id!==id);await persist(h.nome+" excluído");
    }
  });
  el.addEventListener("change",async e=>{
    const i=e.target;if(!i.dataset.date)return;
    const h=state.hist.find(x=>x.id===i.dataset.date);if(!h)return;
    h.data=i.value||null;await persist("Data atualizada");
  });
}

// ---------- Ajustes ----------
let importState="idle",pendingImport=null,importErr="",restoreArm=false,restoreT=null;
let installEvt=null;
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function renderAjustes(){
  const el=$("s-ajustes"),c=state.cfg,n=state.hist.length;
  const showInstall=!standalone&&(installEvt||isIOS);
  el.innerHTML=`
  <header class="sh"><h3>Ajustes</h3></header>
  <h6>Custos por litro</h6>
  <div class="card" style="gap:14px">
    <div class="blk"><label class="t" for="cFrete">Frete</label><small>Aplicado aos quatro combustíveis</small>
      <div class="fld"><span>R$</span><input id="cFrete" data-cfg="frete" data-d="2" inputmode="decimal" autocomplete="off" value="${fmt(c.frete,2)}"><span>/L</span></div></div>
    <div class="hr"></div>
    <div class="blk" style="gap:8px"><span class="t">Imposto</span>
      <div class="seg wide" role="group" aria-label="Forma de cálculo do imposto">
        <button type="button" class="seg-opt" data-modo="pct" aria-pressed="${c.modo==="pct"}">% sobre a venda</button>
        <button type="button" class="seg-opt" data-modo="fix" aria-pressed="${c.modo==="fix"}">Valor fixo por litro</button>
      </div>
      ${c.modo==="pct"?`<div class="blk"><small><label for="cPct">Alíquota sobre o valor de venda</label></small>
        <div class="fld"><input id="cPct" data-cfg="pct" data-d="2" inputmode="decimal" autocomplete="off" value="${fmt(c.pct,2)}"><span>%</span></div></div>`
      :`<div class="fixgrid">${FUELS.map(f=>`<div class="blk" style="gap:4px"><label class="fn" for="fx-${f.id}">${mk(f,"sm")}${f.curto}</label>
        <div class="fld"><span>R$</span><input id="fx-${f.id}" data-fx="${f.id}" data-d="4" inputmode="decimal" autocomplete="off" value="${fmt(c.fixo[f.id]||0,4)}"></div></div>`).join("")}</div>`}
    </div>
    <button type="button" class="btn btn-secondary" id="resetCfg" style="align-self:flex-start"><i class="ph ph-arrow-counter-clockwise"></i>Restaurar padrão</button>
  </div>
  <h6 style="margin-top:10px">Backup</h6>
  <div class="card">
    <div class="note"><i class="ph ph-device-mobile" aria-hidden="true"></i><p>${art
      ?`Os ${n} reajustes e as configurações ficam salvos nesta página. Exporte um backup para guardar uma cópia ou levar a outro aparelho.`
      :`Os ${n} reajustes e as configurações ficam salvos só neste aparelho. Exporte um backup para levar a outro aparelho.`}</p></div>
    <button type="button" class="btn btn-primary start" id="exportBk"><i class="ph ph-download-simple"></i>Exportar backup</button>
    ${canShareFiles&&touch&&!isIOS?`<button type="button" class="btn btn-secondary start" id="shareBk"><i class="ph ph-share-network"></i>Enviar backup</button>`:""}
    ${importState==="armed"?`<div class="confirm" role="alertdialog" aria-label="Confirmar importação">
        <span class="fname"><i class="ph ph-file-text" aria-hidden="true"></i>${esc(pendingImport.name)}</span>
        <p>Este backup tem ${pendingImport.obj.hist.length} reajuste${pendingImport.obj.hist.length===1?"":"s"}${pendingImport.obj.cfg?" e as configurações":""}. Os ${n} reajustes deste aparelho serão substituídos.</p>
        <div class="hbtns"><button type="button" class="btn btn-secondary" id="impCancel">Cancelar</button><button type="button" class="btn btn-primary" id="impOk">Substituir</button></div>
      </div>`
      :`<button type="button" class="btn btn-secondary start" id="importBk"><i class="ph ph-upload-simple"></i>Importar backup</button>`}
    ${importState==="done"?`<span class="ok"><i class="ph ph-check-circle" aria-hidden="true"></i>Backup importado.</span>`:""}
    ${importErr?`<span class="err" role="alert">${esc(importErr)}</span>`:""}
    ${ORIGINAL_HIST.length?`<button type="button" class="btn btn-secondary start danger ${restoreArm?"armed":""}" id="restoreHist"><i class="ph ph-clock-counter-clockwise"></i>${restoreArm?"Toque de novo: isso apaga os reajustes adicionados":"Restaurar histórico original"}</button>`:""}
  </div>
  ${showInstall?`<h6 style="margin-top:10px">Instalar</h6>
  <div class="card">
    <div class="note"><i class="ph ph-download" aria-hidden="true"></i><p>${installEvt?"Instala a calculadora como um app, com ícone na tela inicial e funcionando sem internet.":"No Safari, toque em Compartilhar e depois em “Adicionar à Tela de Início”."}</p></div>
    ${installEvt?`<button type="button" class="btn btn-primary start" id="installBtn"><i class="ph ph-device-mobile"></i>Instalar app</button>`:""}
  </div>`:""}`;
}
let cfgTimer=null;
function cfgChanged(){ls.set(LS_STATE,state);clearTimeout(cfgTimer);cfgTimer=setTimeout(()=>persist("Configurações salvas"),900);}
{
  const el=$("s-ajustes");
  el.addEventListener("input",e=>{
    const t=e.target;
    if(t.dataset.cfg)state.cfg[t.dataset.cfg]=parseBR(t.value);
    else if(t.dataset.fx)state.cfg.fixo[t.dataset.fx]=parseBR(t.value);
    else return;
    ls.set(LS_STATE,state);clearTimeout(cfgTimer);
  });
  el.addEventListener("change",e=>{const t=e.target;if(t.dataset.cfg||t.dataset.fx){t.value=fmt(parseBR(t.value),+t.dataset.d);cfgChanged();}});
  el.addEventListener("click",async e=>{
    const b=e.target.closest("button");if(!b)return;
    if(b.dataset.modo){if(state.cfg.modo!==b.dataset.modo){state.cfg.modo=b.dataset.modo;renderAjustes();cfgChanged();}}
    else if(b.id==="resetCfg"){state.cfg=JSON.parse(JSON.stringify(DEFAULT_CFG));renderAjustes();cfgChanged();}
    else if(b.id==="exportBk")exportar();
    else if(b.id==="shareBk")compartilhar("shareBk");
    else if(b.id==="importBk"){importErr="";const f=$("importFile");f.value="";f.click();}
    else if(b.id==="impCancel"){importState="idle";pendingImport=null;renderAjustes();}
    else if(b.id==="impOk"){
      const bk=pendingImport.obj;importState="done";pendingImport=null;
      state.hist=JSON.parse(JSON.stringify(bk.hist));if(bk.cfg)state.cfg=JSON.parse(JSON.stringify(bk.cfg));
      histOpen=null;delArm=null;draft=draftFrom(last());saveDraft();
      await persist(`Backup importado (${state.hist.length} reajustes)`);
    }
    else if(b.id==="restoreHist"){
      if(!restoreArm){restoreArm=true;renderAjustes();clearTimeout(restoreT);restoreT=setTimeout(()=>{restoreArm=false;if(screen==="ajustes")renderAjustes();},5000);return;}
      restoreArm=false;clearTimeout(restoreT);histOpen=null;
      state.hist=JSON.parse(JSON.stringify(ORIGINAL_HIST));await persist("Histórico original restaurado");
    }
    else if(b.id==="installBtn"&&installEvt){installEvt.prompt();await installEvt.userChoice.catch(()=>null);installEvt=null;renderAjustes();}
  });
}

// ---------- Backup (exportar / importar JSON) ----------
function backupFile(){
  const nome=`reajustes-backup-${today()}.json`;
  const bk={app:"calculadora-reajuste",versao:1,exportado:new Date().toISOString(),cfg:state.cfg,hist:state.hist};
  return {nome,txt:JSON.stringify(bk,null,1)};
}
// Compartilhar arquivo (menu do sistema): no iPhone é o único jeito confiável de salvar o backup no app instalado
const canShareFiles=(()=>{try{return !!(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File(["{}"],"t.json",{type:"application/json"})]}));}catch(e){return false;}})();
const touch=matchMedia("(pointer:coarse)").matches;
async function compartilhar(id){
  const {nome,txt}=backupFile();
  try{await navigator.share({files:[new File([txt],nome,{type:"application/json"})],title:"Backup da Calculadora de Reajuste"});
    setFlash(id,id,`<i class="ph ph-check"></i>${esc(nome)}`,id==="shareBk"?`<i class="ph ph-share-network"></i>Enviar backup`:`<i class="ph ph-download-simple"></i>Exportar backup`);}
  catch(e){if(e&&e.name!=="AbortError")toast("Não foi possível compartilhar o backup.");}
}
function exportar(){
  if(isIOS&&canShareFiles)return compartilhar("exportBk");
  const {nome,txt}=backupFile();
  const url=URL.createObjectURL(new Blob([txt],{type:"application/json"}));
  const a=document.createElement("a");a.href=url;a.download=nome;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  setFlash("exportBk","exportBk",`<i class="ph ph-check"></i>${esc(nome)}`,`<i class="ph ph-download-simple"></i>Exportar backup`);
}
const num=x=>typeof x==="number"&&isFinite(x);
function validarBackup(o){
  if(!o||typeof o!=="object")return "O arquivo não é um backup válido.";
  if(!Array.isArray(o.hist))return "O arquivo não tem a lista de reajustes (hist).";
  const ids=new Set();
  for(const h of o.hist){
    const nome=h&&h.nome?`"${h.nome}"`:"um reajuste";
    if(!h||typeof h.id!=="string"||!h.id||typeof h.nome!=="string")return `Reajuste sem id ou nome.`;
    if(!/^[A-Za-z0-9_-]{1,64}$/.test(h.id))return `Id inválido em ${nome}: use só letras, números, - e _.`;
    if(ids.has(h.id))return `Id repetido: ${h.id}.`;ids.add(h.id);
    if(h.data!=null&&!/^\d{4}-\d{2}-\d{2}$/.test(h.data))return `Data inválida em ${nome}.`;
    if(!Array.isArray(h.itens)||h.itens.length!==4)return `${nome} não tem os 4 combustíveis.`;
    for(const it of h.itens)if(!it||!["q","c","f","t","v"].every(k=>num(it[k]))||(it.tm!=="p"&&it.tm!=="r"))return `Valores inválidos em ${nome}.`;
  }
  if(o.cfg!=null){
    const c=o.cfg;
    if(!num(c.frete)||!num(c.pct)||(c.modo!=="pct"&&c.modo!=="fix")||!c.fixo||!FUELS.every(f=>num(c.fixo[f.id])))return "As configurações do arquivo são inválidas.";
  }
  return null;
}
$("importFile").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  let o;try{o=JSON.parse(await f.text());}catch(_){importErr="Não foi possível ler o arquivo: não é um JSON válido.";importState="idle";renderAjustes();return;}
  const erro=validarBackup(o);
  if(erro){importErr=erro;importState="idle";}else{importErr="";pendingImport={obj:o,name:f.name};importState="armed";}
  renderAjustes();
});

// ---------- Geral ----------
let toastT=null;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600);}

// ---------- PWA: offline, instalação e armazenamento persistente ----------
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
// Pede ao navegador para não apagar os dados salvos (localStorage) quando faltar espaço
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(screen==="ajustes")renderAjustes();});
window.addEventListener("appinstalled",()=>{installEvt=null;toast("App instalado");if(screen==="ajustes")renderAjustes();});

route();
try{const m=sessionStorage.getItem("calc-toast");if(m){sessionStorage.removeItem("calc-toast");toast(m);}}catch(e){}
(async()=>{
  try{art=window.claude&&window.claude.use?await window.claude.use("artifact"):null;}catch(e){art=null;}
  if(art&&screen==="ajustes")renderAjustes();
  // Se havia alterações só neste navegador e agora é possível salvar na página, envia
  if(art&&local&&local.rev>EMBED.rev){try{await art.publish(compose(state));}catch(e){}}
})();
</script>
